# The test job, defined once. Called by tests.yml (manual dispatch, the
# twice-monthly schedule, pushes to dev* branches) and merge-tests.yml (PRs
# to main). Not triggered on its own.
name: test-matrix

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      python-version:
        description: JSON list of Python versions
        type: string
        default: '["3.10", "3.11", "3.12"]'
      gpyreg-ref:
        description: >-
          gpyreg git ref to test against. Empty means the pinned commit below
          (the gpyreg the suite is known to pass with); the scheduled run
          passes "main" to detect drift in gpyreg itself.
        type: string
        default: ''

env:
  # gpyreg v1.3.3. The pin is the tagged commit, so setuptools_scm reads
  # 1.3.3, the minimum in pyproject.toml; an untagged commit before it reads
  # lower, and pip would install gpyreg from PyPI over the pinned checkout.
  GPYREG_PIN: 98ab5a4adecf37eb188521360bd87835979f47e7

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-version) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout PyBADS
        uses: actions/checkout@v6
        with:
          path: pybads
          # full history so setuptools_scm reads PyBADS's version from its
          # tags (a shallow clone reports 0.1.dev1)
          fetch-depth: 0

      - name: Checkout GPyReg
        uses: actions/checkout@v6
        with:
          repository: acerbilab/gpyreg
          ref: ${{ inputs.gpyreg-ref || env.GPYREG_PIN }}
          path: gpyreg
          # full history so setuptools_scm reads gpyreg's real version from
          # its tags (a shallow clone reports 0.1.dev1, below the minimum
          # pyproject.toml requires)
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyBADS
        run: |
          cd ./pybads
          python -m pip install -e ".[test]"

      - name: Install GPyReg
        run: |
          cd ./gpyreg
          git log --oneline -1
          python -m pip install -e .

      - name: Run tests
        run: |
          cd ./pybads
          python -m pytest --reruns=5 -x -vv
