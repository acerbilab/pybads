# pyproject.toml

[project]
name = "PyBADS"
dynamic = ["version"]  # use git tags for version, via setuptools_scm
description = "Bayesian Adaptive Direct Search in Python."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "gpyreg >= 1.4.0",
    # No module of PyBADS imports matplotlib, but gpyreg imports it and asks
    # only for 3.5.1: this floor, set with NumPy 2's, keeps pip from pairing
    # NumPy 2 with an older matplotlib
    "matplotlib >= 3.9.0",
    "numpy >= 2.0.0",
    "scipy >= 1.13.0",
]
requires-python = ">=3.10"

[project.urls]
Documentation = "https://acerbilab.github.io/pybads/"
Source = "https://github.com/acerbilab/pybads"
Changelog = "https://github.com/acerbilab/pybads/blob/main/CHANGELOG.md"
Issues = "https://github.com/acerbilab/pybads/issues"
"Model-fitting tools" = "https://acerbilab.org/model-fitting/"

[tool.setuptools]
include-package-data = true
# Every directory of the package, those that hold only data included; the
# examples are installed as pybads.examples
packages = [
    "pybads",
    "pybads.acquisition_functions",
    "pybads.bads",
    "pybads.bads.option_configs",
    "pybads.decorators",
    "pybads.examples",
    "pybads.examples.scripts",
    "pybads.function_logger",
    "pybads.init_functions",
    "pybads.poll",
    "pybads.search",
    "pybads.stats",
    "pybads.testing",
    "pybads.testing.bads",
    "pybads.testing.bads.poll",
    "pybads.testing.bads.scripts",
    "pybads.testing.bads.search",
    "pybads.testing.decorators",
    "pybads.testing.function_logger",
    "pybads.testing.init_functions",
    "pybads.testing.oracles",
    "pybads.testing.oracles.fixtures",
    "pybads.testing.stats",
    "pybads.testing.utils",
    "pybads.testing.variable_transformer",
    "pybads.utils",
    "pybads.utils.timer",
    "pybads.variable_transformer",
]
package-dir = {"pybads.examples" = "examples"}

[tool.setuptools.package-data]
# Make sure to include example Notebooks:
"pybads.examples" = ["*.ipynb"]

[project.optional-dependencies]
# What the test suite needs (`pytest --pyargs pybads`); CI installs it.
test = [
    "pytest >= 6.2.5",
    "pytest-mock >= 3.6.1",
]
dev = [
    "imageio >= 2.13.5",
    "corner >= 2.2.1",
    "dill >= 0.3.5.1",
    "myst_nb >= 0.13.1",
    "numpydoc >= 1.2.1",
    "pylint >= 2.15.5",
    "pytest >= 6.2.5",
    "pytest-cov >= 4.0.0",
    "pytest-mock >= 3.6.1",
    "sphinx >= 4.3.2",
    "sphinx-book-theme>=0.2.0",
    "build >= 0.9.0",
]

[build-system]
requires = [
    "setuptools >= 77",
    "setuptools_scm[toml] >= 6.2",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79

[tool.isort]
skip_glob = []
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
profile = "black"

[tool.pycln]
all = true

[tool.pytest.ini_options]
testpaths = ["pybads/testing"]

[tool.setuptools_scm]
write_to = "pybads/_version.py"
